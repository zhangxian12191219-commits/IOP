# 多实例 / 负载均衡部署示例（两个应用实例 + MySQL + Redis + Nginx）
#
# 用法：
#   docker compose -f deploy/docker-compose.multi.yml up -d --build
#   访问 http://服务器IP:8088/
#
# 说明：
#   - instance-1 跑后台任务（采集/网站调度/备份/审计清理），instance-2 仅处理 Web 请求
#   - 验证码/缓存使用共享 Redis；数据库为 MySQL
#   - 生产环境请修改 MYSQL_PASSWORD / AUTH_SECRET
#   - 上传图标目录使用共享命名卷；多主机场景请改为 NFS/共享存储

services:
  snmp-nms-1:
    build:
      context: ..
      dockerfile: Dockerfile
    image: snmp-nms:1.1.0
    container_name: snmp-nms-1
    restart: unless-stopped
    init: true
    stop_grace_period: 30s
    environment:
      TZ: Asia/Shanghai
      DATABASE_URL: mysql+pymysql://nms:${MYSQL_PASSWORD:-nms123}@mysql:3306/snmp_nms?charset=utf8mb4
      REDIS_URL: redis://redis:6379/0
      AUTH_SECRET: ${AUTH_SECRET:?AUTH_SECRET is required for multi-instance deployment}
      INSTANCE_ID: instance-1
      RUN_BACKGROUND_TASKS: "1"
      UPLOAD_DIR: /data/uploads
      LOG_DIR: /data/logs
      LOG_LEVEL: INFO
      DB_POOL_SIZE: "20"
      DB_MAX_OVERFLOW: "40"
    volumes:
      - snmp-uploads:/data/uploads
      - snmp-logs:/data/logs
    ports:
      - "8001:8000"
    cap_add:
      - NET_RAW
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

  snmp-nms-2:
    image: snmp-nms:1.1.0
    container_name: snmp-nms-2
    restart: unless-stopped
    init: true
    stop_grace_period: 30s
    environment:
      TZ: Asia/Shanghai
      DATABASE_URL: mysql+pymysql://nms:${MYSQL_PASSWORD:-nms123}@mysql:3306/snmp_nms?charset=utf8mb4
      REDIS_URL: redis://redis:6379/0
      AUTH_SECRET: ${AUTH_SECRET:?AUTH_SECRET is required for multi-instance deployment}
      INSTANCE_ID: instance-2
      RUN_BACKGROUND_TASKS: "0"
      UPLOAD_DIR: /data/uploads
      LOG_DIR: /data/logs
      LOG_LEVEL: INFO
      DB_POOL_SIZE: "20"
      DB_MAX_OVERFLOW: "40"
    volumes:
      - snmp-uploads:/data/uploads
      - snmp-logs:/data/logs
    ports:
      - "8002:8000"
    cap_add:
      - NET_RAW
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

  nginx:
    image: nginx:1.27-alpine
    container_name: snmp-nms-nginx
    restart: unless-stopped
    ports:
      - "8088:80"
    volumes:
      - ./nginx-lb.docker.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - snmp-nms-1
      - snmp-nms-2

  mysql:
    image: mysql:8.4
    container_name: snmp-nms-mysql
    restart: unless-stopped
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --max_connections=500
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root123}
      MYSQL_DATABASE: snmp_nms
      MYSQL_USER: nms
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-nms123}
      TZ: Asia/Shanghai
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-unms", "-p${MYSQL_PASSWORD:-nms123}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s

  redis:
    image: redis:7-alpine
    container_name: snmp-nms-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  snmp-uploads:
  snmp-logs:
  mysql-data:
  redis-data:
