# Nginx 负载均衡（Docker Compose 版，upstream 使用 compose 服务名）
upstream snmp_nms_backend {
    server snmp-nms-1:8000 max_fails=3 fail_timeout=30s;
    server snmp-nms-2:8000 max_fails=3 fail_timeout=30s;
    keepalive 32;
}

server {
    listen 80;
    server_name _;

    client_max_body_size 500m;
    proxy_read_timeout 600s;
    proxy_send_timeout 600s;

    location / {
        proxy_pass http://snmp_nms_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
    }

    location = /api/health {
        proxy_pass http://snmp_nms_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        access_log off;
    }

    location = /metrics {
        proxy_pass http://snmp_nms_backend;
        access_log off;
    }
}
